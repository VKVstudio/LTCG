<script>
(function () {
  var root = document.documentElement;
  var box = document.querySelector('.theme');
  if (!box) return;
  var btns = box.querySelectorAll('.theme__btn');

  function read() {
    try { var v = localStorage.getItem('ltcg-theme'); return (v === 'light' || v === 'dark') ? v : 'auto'; }
    catch (e) { return 'auto'; }
  }
  function paint(mode) {
    if (mode === 'auto') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', mode);
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-pressed', String(btns[i].dataset.set === mode));
    }
  }
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function () {
      var m = this.dataset.set;
      try { m === 'auto' ? localStorage.removeItem('ltcg-theme') : localStorage.setItem('ltcg-theme', m); }
      catch (e) {}
      paint(m);
    });
  }
  paint(read());
  box.hidden = false;
})();
</script>

<script>
(function () {
  var d = document.documentElement;
  var box = document.querySelector('.theme');
  if (!box) return;
  var btns = box.querySelectorAll('button');

  function read() {
    try { return localStorage.getItem('ltcg-theme') || 'auto'; } catch (e) { return 'auto'; }
  }
  function paint(mode) {
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-pressed', String(btns[i].dataset.set === mode));
    }
  }
  function apply(mode) {
    if (mode === 'auto') d.removeAttribute('data-theme');
    else d.setAttribute('data-theme', mode);
    try {
      if (mode === 'auto') localStorage.removeItem('ltcg-theme');
      else localStorage.setItem('ltcg-theme', mode);
    } catch (e) {}
    paint(mode);
  }

  paint(read());
  box.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-set]');
    if (b) apply(b.dataset.set);
  });
})();
</script>

<script>
  (function () {
    var root = document.documentElement;
    var btns = Array.prototype.slice.call(document.querySelectorAll('[data-set-theme]'));
    function read() {
      try { var v = localStorage.getItem('ltcg-theme'); return (v === 'light' || v === 'dark') ? v : 'auto'; }
      catch (e) { return 'auto'; }
    }
    function paint(mode) {
      if (mode === 'auto') root.removeAttribute('data-theme');
      else root.setAttribute('data-theme', mode);
      btns.forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.getAttribute('data-set-theme') === mode));
      });
    }
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        var mode = b.getAttribute('data-set-theme');
        try {
          if (mode === 'auto') localStorage.removeItem('ltcg-theme');
          else localStorage.setItem('ltcg-theme', mode);
        } catch (e) {}
        paint(mode);
      });
    });
    paint(read());
  })();
</script>
